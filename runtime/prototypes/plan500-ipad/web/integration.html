      assert('nonconflicting held edit applies after confirmed cancellation', (await read('after-cancel.txt')).text === '取消后草稿');
      const final = (await read('running.txt')).text;
      await new Promise(resolve => setTimeout(resolve, 400));
      assert('cancelled Linux writer stops changing project bytes', (await read('running.txt')).text === final);
      const saved = await native('checkpoint', {snapshot: await instrument(worker, 'home-snapshot')});
      assert('official session flushed into native durable home checkpoint', saved.durable);
    }
    worker.terminate();
    await native('done', {result: {passed: true, checks, workerIntegrated: true, modelNetworkVerified: false}});
  }
} catch (error) {
  await native('done', {result: {passed: false, checks, error: String(error)}});
}

  let worker, outcome;
